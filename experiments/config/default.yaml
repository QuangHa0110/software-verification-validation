runs: 10
llm:
  provider: codex-cli
  codex_path: codex  # PATH, or an absolute path to the executable
  agy_path: agy      # PATH, or an absolute path to the executable
  agy_inline_max_chars: 8000
  scratch_dir: .work/llm-scratch
  timeout_s: 300
  model: gpt-6.2-astra
  effort: medium
  max_output_tokens: 16000
  price_per_mtok_input: null
  price_per_mtok_output: null
llm_weak:
  provider: agy-cli
  model: gemini-3.8-flash-low
  effort: low
  timeout_s: 1800
random:
  seed_base: 1000
  num_tests: 100
p3:
  timeout_s: 1800
p4:
  timeout_s: 1800
  max_iterations: 5
  target_branch_coverage: 100
  token_budget: 400000
  stop_if_no_gain_iterations: 2
  demo_max_iterations: 2
  p4b:
    max_iterations: 3
    token_budget: 300000
    target_mutation_score: 100
    stop_if_no_gain_iterations: 2
measure:
  mutation: true
  custom_mutation: true
  custom_workers: 3
  custom_timeout_constant_s: 10
  timeout_factor: 3
  pit_mutators: [CONDITIONALS_BOUNDARY, MATH, VOID_METHOD_CALLS, EXPERIMENTAL_MEMBER_VARIABLE, TRUE_RETURNS, FALSE_RETURNS]
